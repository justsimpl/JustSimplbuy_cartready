app = "instabooks-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.prod"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[env]
  DB_NAME = "justsimplbuy"
  ENV = "production"
  CORS_ORIGINS = "https://instabooks.digital,https://www.instabooks.digital,https://main.instabooks.pages.dev"
