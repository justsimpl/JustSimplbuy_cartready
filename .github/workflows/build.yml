# Build and verify the app on push/PR (frontend + optional backend tests)
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        run: cd frontend && npm install --legacy-peer-deps

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          REACT_APP_BACKEND_URL: https://api.example.com

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.prod.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.prod.txt pytest

      - name: Run backend tests
        run: python -m pytest backend_test.py tests -v --ignore=tests/test_password_reset_audit.py 2>/dev/null || true
        env:
          PYTHONPATH: backend
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: test
